<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【極秘】アカウント一括登録ツール</title>

    <script>
        // 直打ちページですが、万が一URLがバレた時のための権限チェック
        if (localStorage.getItem('userRole') !== 'admin') {
            alert('アクセス権限がありません。');
            window.location.replace('login.html');
        }
    </script>

    <style>
        body { font-family: monospace, sans-serif; background-color: #222; color: #eee; padding: 30px; }
        .container { max-width: 800px; margin: 0 auto; background: #333; padding: 20px; border-radius: 8px; border: 1px solid #555; }
        h1 { color: #ff9800; font-size: 1.5em; border-bottom: 1px solid #555; padding-bottom: 10px; margin-top: 0; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        textarea { 
            width: 100%; height: 250px; background: #111; color: #0f0; 
            border: 1px solid #555; padding: 10px; box-sizing: border-box; 
            font-family: monospace; font-size: 14px;
        }
        
        .btn { 
            background: #ff9800; color: #111; border: none; padding: 10px 20px; 
            font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1em; 
        }
        .btn:hover { background: #e68a00; }
        .btn:disabled { background: #555; cursor: not-allowed; }

        .log-area { 
            margin-top: 20px; background: #000; padding: 10px; 
            height: 200px; overflow-y: auto; border: 1px solid #444; 
            font-size: 13px; color: #ccc;
        }
        .log-success { color: #4caf50; }
        .log-error { color: #f44336; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ アカウント一括作成ツール (直打ち専用)</h1>
        
        <p style="color: #aaa; font-size: 0.9em;">
            ※このページは他の画面とリンクしていません。作業後はブラウザのタブを閉じてください。<br>
            ※「学籍番号,初期パスワード」の形式で1行ずつ入力してください。
        </p>

        <div class="form-group">
            <textarea id="bulk-input" placeholder="123456,pass1234&#10;234567,pass5678&#10;345678,pass9012"></textarea>
        </div>

        <button id="btn-execute" class="btn">アカウントを一括作成する</button>

        <div class="log-area" id="log-console">
            <div>システム準備完了。データを入れて実行してください。</div>
        </div>
    </div>

    <script type="module">
        // ★重要: firebase.js から firebaseConfig を読み込めるようにしておくこと
        import { firebaseConfig } from "./firebase.js";
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

        // ==========================================
        // サブアプリの初期化（メインのログイン状態を保持するため）
        // ==========================================
        const secondaryApp = initializeApp(firebaseConfig, "AdminCreatorApp");
        const secondaryAuth = getAuth(secondaryApp);

        const btnExecute = document.getElementById('btn-execute');
        const bulkInput = document.getElementById('bulk-input');
        const logConsole = document.getElementById('log-console');

        function addLog(msg, type = 'normal') {
            const div = document.createElement('div');
            div.textContent = msg;
            if (type === 'success') div.className = 'log-success';
            if (type === 'error') div.className = 'log-error';
            logConsole.appendChild(div);
            logConsole.scrollTop = logConsole.scrollHeight; // 自動スクロール
        }

        btnExecute.addEventListener('click', async () => {
            const text = bulkInput.value.trim();
            if (!text) return alert('データが入力されていません。');

            const lines = text.split('\n').map(line => line.trim()).filter(line => line !== '');
            if (!confirm(`${lines.length} 件のアカウントを作成します。よろしいですか？`)) return;

            btnExecute.disabled = true;
            btnExecute.textContent = '処理中...';
            addLog(`--- 処理開始 (${lines.length}件) ---`);

            let successCount = 0;
            let errorCount = 0;

            for (const line of lines) {
                const parts = line.split(',');
                if (parts.length !== 2) {
                    addLog(`[エラー] 書式が不正です: ${line}`, 'error');
                    errorCount++;
                    continue;
                }

                const id = parts[0].trim();
                const password = parts[1].trim();
                const email = `${id}@dummy.local`; // ダミーアドレスを生成

                if (password.length < 6) {
                    addLog(`[エラー] パスワードは6文字以上必要です: ${id}`, 'error');
                    errorCount++;
                    continue;
                }

                try {
                    // サブアプリ側でユーザーを作成
                    await createUserWithEmailAndPassword(secondaryAuth, email, password);
                    
                    // 作成直後にサブアプリ側からログアウト（必須）
                    await signOut(secondaryAuth);
                    
                    addLog(`[成功] 作成完了: ${id}`, 'success');
                    successCount++;
                    
                } catch (error) {
                    console.error(error);
                    let errMsg = '登録失敗';
                    if (error.code === 'auth/email-already-in-use') errMsg = '既に登録されています';
                    addLog(`[エラー] ${id}: ${errMsg}`, 'error');
                    errorCount++;
                }
            }

            addLog(`--- 処理終了 (成功: ${successCount}, 失敗: ${errorCount}) ---`);
            btnExecute.disabled = false;
            btnExecute.textContent = 'アカウントを一括作成する';
        });
    </script>
</body>
</html>
